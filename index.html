<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cherfaoui Benacer | Solvytech Solutions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="main.css">
</head>
<body>

  <!-- Toast Notification -->
  <div id="toast" class="toast">
    <i class="fas fa-check-circle"></i>
    <span>Fiche contact enregistrée avec succès !</span>
  </div>

  <div class="card">
    <!-- Bannière avec halo -->
    <div class="banner">
      <div class="banner-glow"></div>
    </div>

    <div class="card-content">
      <!-- Photo de profil avec anneau lumineux -->
      <div class="avatar-ring">
        <img src="benacer.jpg" alt="Cherfaoui Benacer" class="avatar-img" width="100" height="100">
      </div>

      <!-- Identité -->
      <div class="profile-header">
        <h1 class="profile-name">Cherfaoui Benacer</h1>
        <p class="profile-role">Founder &amp; CEO</p>
        <p class="profile-company">Solvytech Solutions</p>
      </div>

      <!-- Badges d'expertise -->
      <div class="tags-row">
        <span class="tag">Cloud Architecture</span>
        <span class="tag">DevOps &amp; SRE</span>
        <span class="tag">ERP Integration</span>
      </div>

      <!-- Raccourcis d'actions rapides -->
      <div class="quick-actions">
        <a href="tel:+212775757387" class="action-tile" title="Appeler">
          <div class="tile-icon"><i class="fas fa-phone"></i></div>
          <span>Appeler</span>
        </a>
        <a href="https://wa.me/212775757387" class="action-tile" target="_blank" rel="noopener" title="WhatsApp">
          <div class="tile-icon"><i class="fab fa-whatsapp"></i></div>
          <span>WhatsApp</span>
        </a>
        <a href="mailto:b.cherfaoui@solvytech.com" class="action-tile" title="Envoyer un e-mail">
          <div class="tile-icon"><i class="fas fa-envelope"></i></div>
          <span>E-mail</span>
        </a>
        <a href="https://www.linkedin.com/in/benacer-cherfaoui-614430159" class="action-tile" target="_blank" rel="noopener" title="LinkedIn">
          <div class="tile-icon"><i class="fab fa-linkedin-in"></i></div>
          <span>LinkedIn</span>
        </a>
      </div>

      <!-- Liens détaillés -->
      <div class="links-group">
        <a href="https://solvytech.com" class="link-tile" target="_blank" rel="noopener">
          <div class="link-inner">
            <i class="fas fa-globe"></i>
            <span>solvytech.com</span>
          </div>
          <i class="fas fa-arrow-up-right-from-square icon-sub"></i>
        </a>

        <a href="mailto:b.cherfaoui@solvytech.com" class="link-tile">
          <div class="link-inner">
            <i class="fas fa-at"></i>
            <span>b.cherfaoui@solvytech.com</span>
          </div>
          <i class="fas fa-chevron-right icon-sub"></i>
        </a>
      </div>

      <!-- Bouton vCard -->
      <a href="Cherfaoui-Benacer.vcf" download id="download-button" class="btn-primary">
        <i class="fas fa-user-plus"></i>
        <span>Enregistrer dans les contacts</span>
      </a>

      <!-- Logo Solvytech -->
      <a href="https://solvytech.com" target="_blank" rel="noopener" class="footer-brand">
        <img src="solvytech-logo-colored.svg" alt="Solvytech" class="company-logo-img" height="26" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';">
        <span id="logo-fallback" class="logo-text-fallback">SolvyTech</span>
      </a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
